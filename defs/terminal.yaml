- key: terminal.background.opacity.active
  type: float
  range: [0.0, 1.0]
  default: 0
  ui: {group: Quick, control: slider, step: 0.01, label: Focused terminal opacity, order: 10, display: percent}
  description: Background opacity of the focused terminal window; zero leaves only the glass material behind the text
- key: terminal.background.opacity.inactive
  type: float
  range: [0.0, 1.0]
  default: 0
  ui: {group: Quick, control: slider, step: 0.01, label: Unfocused terminal opacity, order: 20, display: percent}
  description: Background opacity of unfocused terminal windows
- key: terminal.window.opacity.active
  type: float
  range: [0.0, 1.0]
  default: 0.98
  ui: {group: Opacity & Focus, control: slider, step: 0.01, label: Focused window opacity, order: 100, display: percent}
  description: Compositor whole-window opacity of the focused terminal
- key: terminal.window.opacity.inactive
  type: float
  range: [0.0, 1.0]
  default: 0.95
  ui: {group: Opacity & Focus, control: slider, step: 0.01, label: Unfocused window opacity, order: 110, display: percent}
  description: Compositor whole-window opacity of unfocused terminals
- key: terminal.apps
  type: list
  items: string
  default: [kitty, com.mitchellh.ghostty]
  ui: {group: terminal, control: none}
  description: Exact app ids treated as terminals by compositor rules and the glass material

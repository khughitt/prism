  ui: {group: Quick, control: slider, step: 0.01, label: Unfocused terminal opacity, order: 20}
  description: Background opacity of unfocused terminal windows
- key: terminal.window.opacity.active
  type: float
  range: [0.0, 1.0]
  default: 0.98
  ui: {group: Opacity & Focus, control: slider, step: 0.01, label: Focused window opacity, order: 100}

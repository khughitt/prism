- key: terminal.background.opacity.active
  type: float
  range: [0.0, 1.0]
  default: 0.95
  ui: {group: terminal, control: slider, step: 0.01}
  description: Background opacity of the focused terminal window
- key: terminal.background.opacity.inactive
  type: float
  range: [0.0, 1.0]
  default: 0.65
  ui: {group: terminal, control: slider, step: 0.01}
  description: Background opacity of unfocused terminal windows
- key: terminal.window.opacity.active
  type: float
  range: [0.0, 1.0]
  default: 0.98
  ui: {group: terminal, control: slider, step: 0.01}
  description: Compositor whole-window opacity of the focused terminal
- key: terminal.window.opacity.inactive
  type: float
  range: [0.0, 1.0]
  default: 0.95
  ui: {group: terminal, control: slider, step: 0.01}
  description: Compositor whole-window opacity of unfocused terminals
- key: terminal.blur
  type: bool
  default: true
  ui: {group: terminal, control: toggle}
  description: Blur the area behind terminal windows
- key: terminal.saturation.active
  type: float
  range: [0.0, 2.0]
  default: 1.0
  ui: {group: terminal, control: slider, step: 0.05}
  description: Backdrop saturation behind the focused terminal
- key: terminal.saturation.inactive
  type: float
  range: [0.0, 2.0]
  default: 0.85
  ui: {group: terminal, control: slider, step: 0.05}
  description: Backdrop saturation behind unfocused terminals
- key: terminal.noise.active
  type: float
  range: [0.0, 1.0]
  default: 0.1
  ui: {group: terminal, control: slider, step: 0.01}
  description: Backdrop noise behind the focused terminal
- key: terminal.noise.inactive
  type: float
  range: [0.0, 1.0]
  default: 0.01
  ui: {group: terminal, control: slider, step: 0.01}
  description: Backdrop noise behind unfocused terminals
- key: terminal.apps
  type: list
  items: string
  default: [kitty, ghostty]
  ui: {group: terminal, control: none}
  description: App ids treated as terminals by compositor rules and glass panes

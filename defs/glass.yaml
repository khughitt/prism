  ui: {group: Focus, control: slider, step: 1, label: Unfocused Drift rate, order: 361, unit: Hz, state: unfocused, row: Drift rate}
  description: Aurora updates per second; 0 pins the field, and reduced motion halves this rate on unfocused terminals
- key: glass.auroraColorA
  type: color
  default: '#3dffb0'
  neutral: '#3dffb0'
  ui: {group: Focus, control: color, label: Color A, order: 370, state: focused, row: Color A}
  description: First color of the aurora field
- key: glass.inactive.auroraColorA
  type: color
  default: '#3dffb0'
  neutral: '#3dffb0'
  ui: {group: Focus, control: color, label: Unfocused Color A, order: 371, state: unfocused, row: Color A}
  description: First color of the aurora field on unfocused terminals
- key: glass.auroraColorB
  type: color
  default: '#7a5cff'
  neutral: '#7a5cff'
  ui: {group: Focus, control: color, label: Color B, order: 380, state: focused, row: Color B}
  description: Second color of the aurora field
- key: glass.inactive.auroraColorB
  type: color
  default: '#7a5cff'
  neutral: '#7a5cff'
  ui: {group: Focus, control: color, label: Unfocused Color B, order: 381, state: unfocused, row: Color B}
  description: Second color of the aurora field on unfocused terminals
# Reflection's default 0.6 is the owner's pick from niri-material's glass-edge
# contact sheet; edge highlight's pick was 0, its native neutral.
- key: glass.reflection
  type: float
  range: [0, 1]
  default: 0.6
  neutral: 0
  ui: {group: Focus, control: slider, step: 0.01, label: Reflection, order: 390, display: percent, state: focused, row: Reflection}
  description: The scene beyond the edge mirrored in the bevel, untinted, so a dark edge still shows the wallpaper's colors; roughness softens it
- key: glass.inactive.reflection
  type: float
  range: [0, 1]
  default: 0.6
  neutral: 0
  ui: {group: Focus, control: slider, step: 0.01, label: Unfocused reflection, order: 391, display: percent, state: unfocused, row: Reflection}
  description: The scene beyond the edge mirrored in the bevel of unfocused terminals, untinted; roughness softens it
- key: glass.edgeHighlight
  type: float
  range: [0, 1]
  default: 0
  neutral: 0
  ui: {group: Focus, control: slider, step: 0.01, label: Edge highlight, order: 395, display: percent, state: focused, row: Edge highlight}
  description: Key-light glint on the bevel from the top left, which sways with a window's signal while Edge tint is on; roughness widens it
- key: glass.inactive.edgeHighlight
  type: float
  range: [0, 1]
  default: 0
  neutral: 0
  ui: {group: Focus, control: slider, step: 0.01, label: Unfocused edge highlight, order: 396, display: percent, state: unfocused, row: Edge highlight}
  description: Key-light glint on the bevel of unfocused terminals from the top left; roughness widens it

# Bypass: one per rack device, shared by both focus states. The niri sink
# writes the device's dry value into both materials while the key is true; the
# mix parameters keep their numbers, so switching the device back on restores
# them exactly. The rack (defs/rack/devices.yaml) says which device each key
# belongs to.
- key: glass.bypass.backdrop
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass backdrop, order: 400}
  description: Silence the backdrop stage; both materials get blur 0 and no frosted backdrop while set, and the Blur and Frosted backdrop values keep their numbers
- key: glass.bypass.distortion
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass distortion, order: 410}
  description: Silence the distortion stage; both materials get distortion 0 while set, and the Distortion and Distortion detail values keep their numbers
- key: glass.bypass.refraction
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass refraction, order: 420}
  description: Silence the refraction stage; both materials get refraction 1, fringing 0, and directional blur 0 while set, because those two ride the refraction taps, and Blur flattens too since its strength scales with refraction above 1. Every value keeps its number
- key: glass.bypass.fringing
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass fringing, order: 430}
  description: Silence the fringing stage; both materials get fringing 0 while set, and the Fringing values keep their numbers
- key: glass.bypass.directionalBlur
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass directional blur, order: 440}
  description: Silence the directional blur stage; both materials get directional blur 0 while set, and the Directional blur values keep their numbers
- key: glass.bypass.tint
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass tint, order: 450}
  description: Silence the tint stage; both materials get a white tint while set, which absorbs nothing at any distance, and the Tint and Tint distance values keep their numbers
- key: glass.bypass.saturation
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass saturation, order: 460}
  description: Silence the saturation stage; both materials get saturation 1 while set, and the Saturation values keep their numbers
- key: glass.bypass.noise
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass noise, order: 470}
  description: Silence the noise stage; both materials get noise 0 while set, since the grain type is shared, and the Noise values keep their numbers
- key: glass.bypass.iridescence
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass iridescence, order: 435}
  description: Silence iridescence in both materials while retaining all its controls
- key: glass.bypass.aurora
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass aurora, order: 455}
  description: Silence aurora in both materials while retaining all its controls
- key: glass.bypass.reflection
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass reflection, order: 456}
  description: Silence the bevel reflection in both materials while retaining its values
- key: glass.bypass.edgeHighlight
  type: bool
  default: false
  neutral: false
  ui: {group: Focus, control: toggle, label: Bypass edge highlight, order: 457}
  description: Silence the bevel's key-light glint in both materials while retaining its values

# Ring: the lit filament in the slab's edge band, shared by the focus light
# and signal accents (niri-material's response block). The defaults are the
# owner's tuned look (2026-10-01): familiar color source, a fast short-lived
# beam with a wandering head, and a thin filament close to the face edge; the
# neutrals stay the native values. The focus split carries the same block in
# both materials, so the unfocused band stays dark until a signal lights it.
# No Ring param differs between focused and unfocused windows, so the rows fall
# in three subgroups whose headings say whom they reach: the band every window
# shares, the signal accent a window's signal hue draws on any window, and the
# focus light only the focused window shows.
- key: glass.ring.focus
  type: bool
  default: true
  neutral: true
  ui: {group: Ring, control: toggle, label: Ring of light, order: 500, header: true}
  description: Light the ring filament on the focused window; off leaves focus to the glass split alone
- key: glass.ring.colorSource
  type: enum
  values: [familiar, noctalia, manual]
  default: familiar
  neutral: noctalia
  ui: {group: Ring, control: select, label: Color source, order: 510, subgroup: Band — every window}
  description: "Who drives the ring color: the Noctalia colorscheme accent, the manual Color below, or familiar, which tints each terminal's ring with its agent session's hue and rests windows without a session on the manual Color"
- key: glass.ring.color
  type: color
  default: '#ccccff'
  neutral: '#ccccff'
  ui: {group: Ring, control: color, label: Color, order: 520, subgroup: Band — every window, when: {param: glass.ring.colorSource, in: [manual], otherwise: effective}}
  description: Ring color, editable under the manual source; under familiar it is the resting color of windows without a session, and under noctalia the fallback until a colorscheme exists, both shown read-only
- key: glass.ring.gap
  type: int
  range: [0, 128]
  default: 6
  neutral: 8
  ui: {group: Ring, control: slider, step: 1, label: Gap, order: 530, unit: px, subgroup: Band — every window}
  description: Clear glass between the edge of the face and the centre of the beam; the bevel may be shrunk to make room, and a pane whose face is narrower than twice this shows no ring at all
- key: glass.ring.width
  type: float
  range: [0.2, 16]
  default: 1.1
  neutral: 2.6
  ui: {group: Ring, control: slider, step: 0.1, label: Width, order: 535, unit: px, subgroup: Band — every window}
  description: Thickness of the lit filament, the one band the beam, its tail and the resting glow all share; it is centred Gap px inside the face edge, so a width past the Gap reaches that edge
# light-ior bends only the light travelling inside the slab — the ring filament
# and the aurora field — along the light path 1 + (ior - 1) * light-ior; the
# backdrop taps keep the plain Refraction index, so this is not a second IOR for
# the image behind the glass. Shared by both focus states: the ring lights the
# focused window, and a divergent multiplier would make a material swap jump the
# aurora. The native default is 6 and Prism ships the owner's 4.5; the ring's
# shared shift is capped at half the Gap; once it reaches that cap, only
# fringing, perturbed normals and aurora retain light-ior dependence.
- key: glass.lightIor
  type: float
  range: [1, 12]
  default: 4.5
  neutral: 6
  ui: {group: Ring, control: slider, step: 0.5, label: Halo bending, order: 540, subgroup: Band — every window}
  description: Bends the ring's halo on the bevel and the aurora field when enabled; the band on an undistorted flat face stays put. The ring's shared shift stops at half the Gap, so higher values can look unchanged, especially at small Gap; Fringing and motion can still respond. Refraction controls the backdrop
- key: glass.ring.accent
  type: float
  range: [0, 3]
  default: 1
  neutral: 1
  ui: {group: Ring, control: slider, step: 0.1, label: Accent strength, order: 545, subgroup: Signal accent — any window with a signal}
  description: Brightness of the outline a window's signal hue draws on the band, on any window; 0 removes the outline while the hue still colors the beam and the resting ring. Glow and Resting ring do not reach it
- key: glass.ring.edgeTint
  type: bool
  default: true
  neutral: true
  ui: {group: Ring, control: toggle, label: Edge tint, order: 547, subgroup: Signal accent — any window with a signal}
  description: Tint the bevel's edge glint with a window's signal hue, swaying with the signal level; off keeps the glint neutral
- key: glass.ring.beamSpeed
  type: int
  range: [0, 5000]
  default: 4350
  neutral: 300
  replaces: glass.ring.sweepMs
  ui: {group: Ring, control: slider, step: 50, label: Beam speed, order: 550, unit: px/s, subgroup: Focus light — focused window only}
  description: How fast the beam of light travels around the inside of the face when a window gains focus, in pixels per second; a lap takes the face's perimeter divided by this, and 0 shows only the resting glow
- key: glass.ring.beamNoise
  type: float
  range: [0, 1]
  default: 0.55
  neutral: 0
  ui: {group: Ring, control: slider, step: 0.05, label: Head shimmer, order: 552, subgroup: Focus light — focused window only}
  description: Varies only the moving focus beam head's brightness, not its position or width; 0 keeps it steady. Refocus a window to see it; Beam speed 0 prevents new beams. The shimmer leaves the tail and resting ring unchanged. Try a slower beam and lower Shimmer rate; Decay distance 0 disables distance fading
- key: glass.ring.beamNoiseHz
  type: float
  range: [0, 30]
  default: 12
  neutral: 3
  ui: {group: Ring, control: slider, step: 0.5, label: Shimmer rate, order: 554, unit: Hz, subgroup: Focus light — focused window only}
  description: Speed of the moving focus beam head's brightness variation in Hz; try about 3 Hz to see a slower shimmer. Has no effect when Head shimmer is 0 or the head has faded or completed its lap; 0 keeps the head's brightness steady. Refocus a window to replay the beam; Beam speed 0 prevents new beams
- key: glass.ring.decay
  type: int
  range: [0, 20000]
  default: 4150
  neutral: 0
  ui: {group: Ring, control: slider, step: 50, label: Decay distance, order: 556, unit: px, subgroup: Focus light — focused window only}
  description: How far the beam travels before its head and tail have faded out together, in pixels along the band, the same on every window and at every speed; below the window's perimeter the comet dies before its lap closes, and 0 keeps it bright for the whole lap
- key: glass.ring.glow
  type: float
  range: [0, 3]
  default: 1.2
  neutral: 1
  ui: {group: Ring, control: slider, step: 0.1, label: Glow, order: 560, subgroup: Focus light — focused window only}
  description: Intensity of the whole focus light — beam, tail, resting glow and edge spill together
- key: glass.ring.rest
  type: float
  range: [0, 3]
  default: 1
  neutral: 1
  ui: {group: Ring, control: slider, step: 0.1, label: Resting ring, order: 562, subgroup: Focus light — focused window only}
  description: Brightness of the ring that stays on the focused window once the beam has passed, as a share of Glow; 0 leaves no resting ring while the beam still runs on every focus change

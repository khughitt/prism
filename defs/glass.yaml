- key: glass.enabled
  type: bool
  default: true
  ui: {group: Title, control: toggle, label: Glass, order: 0}
  description: Assign the native niri glass material to terminal windows
- key: glass.paneLip
  type: int
  range: [0, 64]
  default: 6
  ui: {group: Glass Shape, control: slider, step: 1, label: Edge bevel, order: 200, unit: px}
  description: Width the glass slab is inflated beyond the window on each edge
- key: glass.paneShiftX
  type: int
  range: [-64, 64]
  default: 6
  ui: {group: Glass Shape, control: slider, step: 1, label: Horizontal pane offset, order: 210, unit: px}
  description: Horizontal shift of the glass slab
- key: glass.paneShiftY
  type: int
  range: [-64, 64]
  default: 6
  ui: {group: Glass Shape, control: slider, step: 1, label: Vertical pane offset, order: 220, unit: px}
  description: Vertical shift of the glass slab
- key: glass.ior
  type: float
  range: [1, 3]
  default: 1.5
  ui: {group: Glass Optics, control: slider, step: 0.02, label: Refraction, order: 300}
  description: Glass index of refraction
- key: glass.thickness
  type: float
  range: [0, 200]
  default: 20
  ui: {group: Glass Optics, control: slider, step: 0.1, label: Glass depth, order: 310, unit: px}
  description: Depth of the glass slab; higher values bend and tint farther
- key: glass.attenuationColor
  type: color
  default: '#dfe8ff'
  ui: {group: Quick, control: color, label: Glass tint, order: 60}
  description: Color absorbed by the glass volume
- key: glass.attenuationDistance
  type: float
  range: [1, 65535]
  default: 60
  ui: {group: Glass Optics, control: slider, step: 1, label: Tint distance, order: 320, scale: logarithmic, unit: px}
  description: Absorption distance; higher values preserve the wallpaper color farther through the glass
- key: glass.chromaticAberration
  type: float
  range: [0, 1]
  default: 0
  ui: {group: Glass Optics, control: slider, step: 0.02, label: Color fringing, order: 330}
  description: Color-channel separation at refracted edges
- key: glass.distortion
  type: float
  range: [0, 1]
  default: 0
  ui: {group: Glass Optics, control: slider, step: 0.02, label: Distortion, order: 340}
  description: Strength of the glass distortion effect
- key: glass.distortionScale
  type: float
  range: [0.01, 2]
  default: 0.5
  ui: {group: Glass Optics, control: slider, step: 0.01, label: Distortion detail, order: 350, scale: logarithmic}
  description: Distortion frequency; higher values create finer variation
- key: glass.anisotropicBlur
  type: float
  range: [0, 1]
  default: 0
  ui: {group: Glass Optics, control: slider, step: 0.01, label: Directional blur, order: 360, display: percent}
  description: Directional blur applied through the glass
- key: glass.roughness
  type: float
  range: [0, 1]
  default: 0.08
  ui: {group: Quick, control: slider, step: 0.01, label: Glass blur, order: 40, display: percent}
  description: Glass surface roughness
- key: glass.backdropBlur
  type: bool
  default: false
  ui: {group: Glass Optics, control: toggle, label: Frosted backdrop, order: 370}
  description: Refract the blurred backdrop for a frosted look; niri's global blur block supplies blur strength, saturation, and noise
- key: glass.jellyFlex
  type: float
  range: [0, 0.02]
  default: 0.004
  ui: {group: Motion, control: slider, step: 0.0002, label: Flex, order: 400, display: normalized}
  description: Maximum flex of the jelly pane motion
- key: glass.jellyRipple
  type: float
  range: [0, 0.5]
  default: 0.06
  ui: {group: Motion, control: slider, step: 0.005, label: Ripple, order: 410, display: normalized}
  description: Ripple strength of the jelly pane motion
- key: glass.focusSplit
  type: bool
  default: true
  ui: {group: Opacity & Focus, control: toggle, label: Focus-state glass, order: 120}
  description: Give unfocused terminals their own glass material; off keeps one material and never resets the pane motion on focus
- key: glass.inactive.roughness
  type: float
  range: [0, 1]
  default: 0.5
  ui: {group: Opacity & Focus, control: slider, step: 0.01, label: Unfocused glass blur, order: 130, display: percent}
  description: Glass surface roughness of unfocused terminals
- key: glass.inactive.attenuationDistance
  type: float
  range: [1, 65535]
  default: 70
  ui: {group: Opacity & Focus, control: slider, step: 1, label: Unfocused tint distance, order: 140, scale: logarithmic, unit: px}
  description: Absorption distance of unfocused terminals; higher values preserve the wallpaper color farther through the glass
- key: glass.inactive.chromaticAberration
  type: float
  range: [0, 1]
  default: 0.08
  ui: {group: Opacity & Focus, control: slider, step: 0.02, label: Unfocused color fringing, order: 150}
  description: Color-channel separation at refracted edges of unfocused terminals
- key: glass.inactive.distortion
  type: float
  range: [0, 1]
  default: 0.1
  ui: {group: Opacity & Focus, control: slider, step: 0.02, label: Unfocused distortion, order: 160}
  description: Strength of the glass distortion effect on unfocused terminals

id = "khughitt/prism"
name = "Prism"
description = "Control Prism appearance and the native niri material from Noctalia"
version = "1.0.0"
author = "Keith Hughitt"
plugin_api = 22
dependencies = ["prism"]

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
# Wide enough for the Focus matrix's two sliders per row at dotfiles' tracked
# 1.05 UI scale; the height keeps the v4 760 preferred size.
width = 756
height = 798
placement = "attached"
position = "auto"
keyboard_focus = "exclusive"
capture_keys = ["shift+question", "F1", "k", "Up", "j", "Down", "h", "Left", "l", "Right", "r", "ctrl+s", "1", "2", "3", "4", "5", "6", "7", "8", "9"]

sink: niri
generates: [prism.kdl]
requires:
  - probe: material
    when: glass.enabled
    fix: "install niri-material; stock niri does not know the material node"
binds:
  - {param: compositor.gaps, liveness: reload}
  - {param: terminal.apps, liveness: reload}
  - {param: glass.enabled, liveness: reload}
  - {param: glass.paneLip, liveness: reload}
  - {param: glass.paneShiftX, liveness: reload}
  - {param: glass.paneShiftY, liveness: reload}
  - {param: glass.ior, liveness: reload}
  - {param: glass.inactive.ior, liveness: reload}
  - {param: glass.thickness, liveness: reload}
  - {param: glass.inactive.thickness, liveness: reload}
  - {param: glass.attenuationColor, liveness: reload}
  - {param: glass.inactive.attenuationColor, liveness: reload}
  - {param: glass.attenuationDistance, liveness: reload}
  - {param: glass.chromaticAberration, liveness: reload}
  - {param: glass.distortion, liveness: reload}
  - {param: glass.distortionScale, liveness: reload}
  - {param: glass.inactive.distortionScale, liveness: reload}
  - {param: glass.anisotropicBlur, liveness: reload}
  - {param: glass.roughness, liveness: reload}
  - {param: glass.backdropBlur, liveness: reload}
  - {param: glass.inactive.backdropBlur, liveness: reload}
  - {param: glass.jellyFlex, liveness: reload}
  - {param: glass.jellyRipple, liveness: reload}
  - {param: glass.focusSplit, liveness: reload}
  - {param: glass.inactive.roughness, liveness: reload}
  - {param: glass.inactive.attenuationDistance, liveness: reload}
  - {param: glass.inactive.chromaticAberration, liveness: reload}
  - {param: glass.inactive.distortion, liveness: reload}
  - {param: glass.inactive.anisotropicBlur, liveness: reload}
  - {param: glass.noise, liveness: reload}
  - {param: glass.noiseType, liveness: reload}
  - {param: glass.saturation, liveness: reload}
  - {param: glass.inactive.noise, liveness: reload}
  - {param: glass.inactive.saturation, liveness: reload}
  - {param: glass.bypass.backdrop, liveness: reload}
  - {param: glass.bypass.distortion, liveness: reload}
  - {param: glass.bypass.refraction, liveness: reload}
  - {param: glass.bypass.fringing, liveness: reload}
  - {param: glass.bypass.directionalBlur, liveness: reload}
  - {param: glass.bypass.tint, liveness: reload}
  - {param: glass.bypass.saturation, liveness: reload}
  - {param: glass.bypass.noise, liveness: reload}

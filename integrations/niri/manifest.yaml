sink: niri
generates: [prism.kdl]
binds:
  - {param: compositor.gaps, liveness: reload}
  - {param: terminal.apps, liveness: reload}
  - {param: terminal.window.opacity.active, liveness: reload}
  - {param: terminal.window.opacity.inactive, liveness: reload}
  - {param: terminal.blur, liveness: reload}
  - {param: terminal.saturation.active, liveness: reload}
  - {param: terminal.saturation.inactive, liveness: reload}
  - {param: terminal.noise.active, liveness: reload}
  - {param: terminal.noise.inactive, liveness: reload}

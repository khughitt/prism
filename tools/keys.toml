# The shared key vocabulary and the inventory of every application shortcut in the
# keyboard-driven projects. Owned by ops; vendored byte-identical as tools/keys.toml
# into tasks-tui, mind6, wali, and prism, each of which has a test that compares its
# live bindings with its rows here. Rules: docs/specs/2026-09-15-key-vocabulary-design.md,
# "The table file"; validator: tests/test_keys.py.
#
# Sequence spelling: single characters as themselves; chord keys separated by one space
# ("s p", "g g"); named keys Escape Enter space Backspace Tab F1 F5 Up Down Left Right
# Home End PgUp PgDn; modifiers ctrl+ alt+ shift+ lowercase and first ("ctrl+s",
# "shift+Tab", "alt+Up").

version = 1

# Vocabulary: shared actions. A project that has the action binds it to exactly `seq`
# in every scope where the action exists; `aliases` are optional extra sequences.

[action.help]
seq = "?"
aliases = ["F1"]
meaning = "show the key legend or help overlay"

[action.dismiss]
seq = "Escape"
aliases = ["Backspace"]
meaning = "close the overlay, go back, or close the panel"

[action.open]
seq = "Enter"
meaning = "open the focused item"

[action.up]
seq = "k"
aliases = ["Up"]
meaning = "move focus up one item"

[action.down]
seq = "j"
aliases = ["Down"]
meaning = "move focus down one item"

[action.prev]
seq = "h"
aliases = ["Left"]
meaning = "previous in the horizontal or historical dimension: tab, history entry, slider nudge"

[action.next]
seq = "l"
aliases = ["Right"]
meaning = "next in the horizontal or historical dimension: tab, history entry, slider nudge"

[action.top]
seq = "g g"
aliases = ["Home"]
meaning = "first item"

[action.bottom]
seq = "G"
aliases = ["End"]
meaning = "last item"

[action.search]
seq = "/"
meaning = "search or filter the current view"

[action.add]
seq = "a"
meaning = "add a new item"

[action.edit]
seq = "e"
meaning = "edit the focused item"

[action.remove]
seq = "x"
meaning = "remove the focused item from the view: drop, hide, remove member"

[action.yank]
seq = "y"
meaning = "copy the focused item's identifier or path"

[action.random]
seq = "r"
meaning = "pick or apply something at random"

[action.reload]
seq = "F5"
meaning = "reload the view from its source"

[action.sort]
prefix = ["s", "S"]
direction = ["asc", "desc"]
argument = "column and direction"
meaning = "sort by the column named by the second key"

[action.save]
seq = "ctrl+s"
meaning = "save the current thing; where the only save is save-as, open that"

[action.select]
seq = "<digit>"
argument = "target"
meaning = "switch to the nth tab, view form, or profile"

[action.primary]
seq = "space"
argument = "what the toggle does in this project"
meaning = "the item's primary toggle"

[action.palette]
seq = "ctrl+k"
meaning = "command palette, where one exists"

[action.quit]
seq = "q"
aliases = ["ctrl+c"]
meaning = "leave the application; panels use dismiss"

# Reserved: one project owns the sequence and may bind any action to it; the others
# leave it unbound.

[reserved.c]
owner = "tasks-tui"
prefix = true
meaning = "launch a coding agent: c l claude, c o codex, c r crush, c O opencode, c c the picker"

[reserved.w]
owner = "mind6"
meaning = "toggle the focused thought in the working set"

[reserved.f]
owner = "wali"
meaning = "favorite, the same action as primary there"


name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: prism

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TT_FORCE: '1'
      NIRI_MATERIAL_DIR: ${{ github.workspace }}/.ci-material
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: prism
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: khughitt/niri-material
          ref: 3be57dc203fe6c8e854b6f0e427a645688d343ab
          path: .ci-material
          sparse-checkout: resources/materials/pipeline.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.4 zsh
          mkdir -p "$RUNNER_TEMP/prism-bin"
          curl --fail --location --max-time 90 \
            https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/just.tar.gz"
          printf '%s  %s\n' 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e "$RUNNER_TEMP/just.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/prism-bin" just
          ln -s /usr/bin/lua5.4 "$RUNNER_TEMP/prism-bin/lua"
          printf '%s\n' "$RUNNER_TEMP/prism-bin" >> "$GITHUB_PATH"
      - name: Verify tool versions
        run: |
          lua -v 2>&1 | grep -E '^Lua 5\.4\.'
          just --version
          node --version
          python3 --version
      - name: Install dependencies
        run: npm ci
      - name: Verify renderer input
        id: renderer-input
        run: test -f "$NIRI_MATERIAL_DIR/resources/materials/pipeline.json"
      - name: Portable hygiene
        run: |
          python3 tools/ops-check
          python3 tools/ops-docs check
      - name: Node and Lua suite
        run: |
          just test
          printf '%s\n' 'Node and standalone Lua checks completed'
